name: xdbot

services:
  discord-bot:
    image: "${XDBOT_IMAGE:-ghcr.io/glebenator/xdbot:latest}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/xdbot-ready"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
