[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q --ignore=test_chart_generation.py --ignore=test_music_setup.py --ignore=test_search_tool.py --ignore=test_tool_selection.py --ignore=test_voice_error.py"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"demo_logging.py" = ["E402"]
"test_*.py" = ["E402"]
